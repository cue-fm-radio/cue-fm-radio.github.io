name: Update Enkare episodes and publish
on:
  schedule:
    - cron: '45 3 * * 4'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Fetch RSS and generate static pages
        env:
          ENKARE_RSS_URL: https://anchor.fm/s/ec273278/podcast/rss
        run: python3 update_rss.py . ../site-build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ../site-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


